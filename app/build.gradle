plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nodimobilebanking'
    compileSdk 34

    defaultConfig {
        applicationId "com.nodimobilebanking"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.1"

        // ── Change this to your production URL before release ────────────────
        buildConfigField "String", "BASE_URL", '"https://eastakiba.peshapcloud.com/androidapi/"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", '"https://eastakiba.peshapcloud.com/androidapi/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true; buildConfig true }

    // Suppress lint warnings that block the build
    lint {
        abortOnError false
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Secure token storage
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // PDF statement generation
    implementation 'com.itextpdf:itextpdf:5.5.13.3'

    // Shimmer skeleton loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Glide — load remote images (promotion banners, company logo)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Unit tests only — no androidTest / espresso (no UI tests needed)
    testImplementation 'junit:junit:4.13.2'
}
